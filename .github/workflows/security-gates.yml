name: security-gates

# Authoritative, non-bypassable gate on every push and PR. Local pre-commit hooks
# can be skipped with --no-verify; this cannot.
#
# Scope per gate:
#   - gitleaks:        full Git-history secrets scan (fetch-depth 0 + detect)
#   - image metadata:  current-tree EXIF / embedded-metadata review
#   - environment:     current-tree check for local env files that should never ship
#
# Deliberately NOT ported from penetration-testing-portfolio: the write-up
# validator, the lab-IP audit, and the pentest directory assumptions. Those
# encode rules for a different kind of repository.

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

permissions:
  contents: read

jobs:
  security-gates:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install tooling (gitleaks + exiftool)
        run: |
          set -euo pipefail
          GITLEAKS_VERSION=8.30.1
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | sudo tar -xz -C /usr/local/bin gitleaks
          sudo apt-get update -qq
          sudo apt-get install -y -qq libimage-exiftool-perl

      - name: gitleaks (secrets scan, full history)
        run: gitleaks detect --source . --config .gitleaks.toml --redact --no-banner --verbose

      - name: Image metadata review
        # Portrait photographs and card artwork can carry EXIF from the capture or
        # generation tool — camera model, software, timestamps, and in the worst
        # case GPS coordinates. Images are published assets, so any embedded
        # metadata ships with them. This gate fails on identifying tags rather
        # than merely reporting them.
        run: |
          set -euo pipefail
          echo "Scanning assets/images for identifying metadata..."
          found=0
          while IFS= read -r -d '' img; do
            tags=$(exiftool -s -GPS:all -Make -Model -Software -Artist -Copyright \
                            -CreatorTool -SerialNumber -OwnerName "$img" 2>/dev/null || true)
            if [ -n "$tags" ]; then
              echo "::error file=$img::identifying metadata present"
              echo "$tags"
              found=1
            fi
          done < <(find assets/images -type f \( -name '*.png' -o -name '*.jpg' -o -name '*.jpeg' -o -name '*.webp' \) -print0)
          if [ "$found" -ne 0 ]; then
            echo "Strip metadata before committing (e.g. exiftool -all= <file>)."
            exit 1
          fi
          echo "No identifying image metadata found."

      - name: Environment file check
        # Static site — there is no legitimate reason for a local environment or
        # credential file to be tracked. Deployment secrets live in GitHub Actions
        # secrets and are referenced as ${{ secrets.* }}, never committed.
        run: |
          set -euo pipefail
          matches=$(git ls-files | grep -E '(^|/)(\.env($|\..*)|.*\.pem$|.*\.key$|.*\.p12$|.*\.pfx$|credentials(\.json)?$|\.npmrc$)' || true)
          if [ -n "$matches" ]; then
            echo "::error::environment or credential files are tracked:"
            echo "$matches"
            exit 1
          fi
          echo "No environment or credential files tracked."

      - name: Success marker
        run: echo "SECURITY GATES PASSED"

