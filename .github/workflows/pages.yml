# GitHub Pages publication - website files only (repository audit, STAGE7-REM-03B).
# Runs the same allowlist build as Cloudflare Pages (scripts/build-cloudflare-pages.sh) and publishes
# only its dist/ output, so the repository root (README, docs/, scripts/, .github/) is never published.
# Requires Settings -> Pages -> Source = "GitHub Actions". Actions are pinned to immutable commit SHAs.
name: pages-website-only

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build the website files
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build website files only (shared allowlist build)
        run: bash scripts/build-cloudflare-pages.sh
      - name: Upload the 36-file site as the Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist
  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write     # create the GitHub Pages deployment from the uploaded artifact
      id-token: write  # OIDC token that actions/deploy-pages uses to authenticate the deployment
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
